<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover Art Spatial Vault — Untitled.jpg</title>
  <meta name="description" content="Ultra-minimalist 3D spatial gallery displaying cover art floating in space for Untitled.jpg.">
  <link rel="canonical" href="https://mynameisjpg.github.io/gallery.html">

  <!-- Open Graph / LinkedIn / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Untitled.jpg">
  <meta property="og:title" content="Cover Art Spatial Vault — Untitled.jpg">
  <meta property="og:description" content="Ultra-minimalist 3D spatial gallery displaying cover art floating in space for Untitled.jpg.">
  <meta property="og:url" content="https://mynameisjpg.github.io/gallery.html">
  <meta property="og:image" content="https://mynameisjpg.github.io/assets/images/favicon.svg">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@untitled_jpg">
  <meta name="twitter:title" content="Cover Art Spatial Vault — Untitled.jpg">
  <meta name="twitter:description" content="Ultra-minimalist 3D spatial gallery displaying cover art floating in space for Untitled.jpg.">
  <meta name="twitter:image" content="https://mynameisjpg.github.io/assets/images/favicon.svg">
  
  <!-- Typography: Azeret Mono (UI), Platypi (Prose) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Platypi:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  
  <!-- Three.js 3D WebGL Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Modular Design System Stylesheet -->
  <link rel="stylesheet" href="index.css?v=4">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="shortcut icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <!-- Autonomous Web Components -->
  <script src="js/components/sidebar-rail.js?v=4"></script>
</head>
<body class="gallery-page">

  <!-- ====================================================================
       COMPONENT 1: ULTRA-THIN LEFT SIDEBAR RAIL (48px)
       Autonomous Web Component: <sidebar-rail> (js/components/sidebar-rail.js)
       ==================================================================== -->
  <sidebar-rail active-page="gallery"></sidebar-rail>

  <!-- ====================================================================
       ULTRA-MINIMAL 3D SPATIAL VIEWPORT
       ==================================================================== -->
  <div class="gallery-spatial-viewport">
    
    <!-- Top-Left Subtle Spatial Control Hint -->
    <div class="minimal-spatial-hint">
      <span>&#9632; SPATIAL 3D CANVAS</span> &bull; SCROLL TO ZOOM &bull; CLICK IMAGE FOR FULL VIEW
    </div>

    <!-- Background Ambient Glow -->
    <div class="ambient-vignette"></div>

    <!-- Left / Right Click Nav Chevrons -->
    <div id="side-nav-left" class="gallery-side-nav-zone left" title="Previous Artwork">
      <span class="side-nav-chevron">&lsaquo;</span>
    </div>
    <div id="side-nav-right" class="gallery-side-nav-zone right" title="Next Artwork">
      <span class="side-nav-chevron">&rsaquo;</span>
    </div>

    <!-- 3D Canvas Element -->
    <div id="spatial-canvas-container"></div>

    <!-- ====================================================================
         FLOATING CORNER HUD PANEL
         ==================================================================== -->
    <aside class="floating-hud-panel" aria-label="Active Artwork Info">
      <div class="hud-top-meta">
        <span id="hud-counter-val" class="hud-counter">01 / 11</span>
        <span id="hud-format-val" class="hud-format-badge">[ ESSAY ]</span>
      </div>

      <div class="hud-title-wrap">
        <h2 id="hud-title-val" class="hud-post-title">Loading Artwork...</h2>
        <div id="hud-pillar-val" class="hud-post-pillar">Philosophy of the Image</div>
      </div>

      <div class="hud-actions-row">
        <div class="hud-nav-controls">
          <button type="button" id="hud-prev-btn" class="hud-nav-btn" title="Previous Artwork">&larr; PREV</button>
          <button type="button" id="hud-next-btn" class="hud-nav-btn" title="Next Artwork">NEXT &rarr;</button>
        </div>

        <a id="hud-read-link" href="#" class="hud-read-link">
          READ DISPATCH &rarr;
        </a>
      </div>
    </aside>

  </div>

  <!-- ====================================================================
       FULL-HEIGHT ARTWORK VIEW MODAL WITH SHARE & DOWNLOAD
       ==================================================================== -->
  <div id="artwork-full-modal" class="artwork-full-modal" role="dialog" aria-modal="true" aria-label="Full Height Artwork View" style="display:none;">
    <div class="artwork-full-container">
      <button type="button" id="artwork-modal-close" class="artwork-modal-close-btn" title="Close Full View">[ CLOSE &#215; ]</button>
      
      <div class="artwork-full-image-wrapper">
        <img id="artwork-full-img" src="" alt="Full Height Cover Art" />
      </div>

      <!-- Small Floating Panel with Share & Download -->
      <div class="artwork-full-toolbar">
        <div class="artwork-full-actions">
          <button type="button" id="artwork-share-btn" class="artwork-btn btn-share" title="Copy link to clipboard">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            <span id="share-btn-text">SHARE</span>
          </button>
          <a id="artwork-download-btn" href="#" download class="artwork-btn btn-download" title="Download high resolution artwork">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            DOWNLOAD
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Dependencies -->
  <script src="posts.js?v=4"></script>
  <script src="js/gallery.js?v=4"></script>
</body>
</html>
